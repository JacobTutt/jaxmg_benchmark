[hardware]
gpu_name = "NVIDIA GH200 120GB"
visible_memory_mib = 97871
allocator_fraction = 0.99
gpus_per_node = 4

[sweep]
routines = ["potrs"]
dtypes = ["float32"]
tiles = [256]
grids = ["4x1"]
# Explicit sizes are provided by the submission, so this placeholder only
# satisfies the common planner configuration schema.
baseline_sizes = [1024]
frontier_fractions = [0.85]

[execution]
cold_runs = 1
warm_runs = 1
# Native OOMs can leave peer ranks waiting in NCCL.  Bound each fresh srun so
# one failure cannot prevent the following bracketing cases from running.
case_timeout_seconds = 240
