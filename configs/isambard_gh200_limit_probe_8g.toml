[hardware]
gpu_name = "NVIDIA GH200 120GB"
visible_memory_mib = 97871
allocator_fraction = 0.99
gpus_per_node = 4
cpus_per_gpu = 72

[sweep]
routines = ["potrs"]
dtypes = ["float32"]
tiles = [256]
grids = ["8x1"]
# Explicit sizes are provided by the submission; these fields retain the
# common configuration schema used by the generic suite runner.
baseline_sizes = [1024]
frontier_fractions = [0.85]

[execution]
cold_runs = 1
warm_runs = 1
# Historical 8-GPU runs at T_A=256 take about nine minutes per cold or warm
# call near this frontier. Bound an OOM-induced peer-rank stall without
# rejecting healthy cold-plus-warm cases.
case_timeout_seconds = 1200

[slurm]
suite_walltime = "02:00:00"
suite_memory = "400G"
